document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"69777225-be5f-4506-b4cf-bf26e834059d\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* ============================================================\n   Lattice — Colors & Type\n   Source of truth: kognitos/lattice src/theme.css (OKLCH tokens)\n   Brand hue ≈ 113deg (yellow-green / lime). Neutral grayscale.\n   ============================================================ */\n\n:root {\n  /* --- Radii --- */\n  --radius: 0.25rem;           /* 4px base */\n  --radius-sm: var(--radius);\n  --radius-md: calc(var(--radius) + 2px);\n  --radius-lg: calc(var(--radius) + 4px);\n  --radius-xl: calc(var(--radius) + 4px);\n\n  /* --- Type stack --- */\n  --font-sans: 'PP Neue Montreal', ui-sans-serif, system-ui, sans-serif;\n  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;\n  --font-serif: ui-serif, Georgia, serif;\n  --tracking-normal: 0.01em;\n\n  /* --- Brand (lime-yellow-green) --- */\n  --brand:     oklch(0.963 0.166 113.862);   /* pale/signature */\n  --brand-10:  oklch(0.892 0.165 114.154);\n  --brand-15:  oklch(0.858 0.164 114.307);\n  --brand-20:  oklch(0.822 0.162 114.491);\n  --brand-25:  oklch(0.785 0.160 114.696);\n  --brand-30:  oklch(0.714 0.154 115.167);\n  --brand-35:  oklch(0.676 0.150 115.468);\n  --brand-40:  oklch(0.637 0.144 115.822);\n  --brand-45:  oklch(0.599 0.137 116.248);\n  --brand-50:  oklch(0.599 0.137 116.248);\n  --brand-55:  oklch(0.555 0.127 115.832);\n  --brand-60:  oklch(0.509 0.116 115.905);\n\n  /* --- Core neutrals / surfaces (light) --- */\n  --background: oklch(1 0 0);\n  --foreground: oklch(0.145 0 0);         /* near-black */\n  --card: oklch(1 0 0);\n  --card-foreground: oklch(0.145 0 0);\n  --popover: oklch(1 0 0);\n  --popover-foreground: oklch(0.145 0 0);\n  --muted: oklch(0.955 0 0);\n  --muted-foreground: oklch(0.556 0 0);\n  --accent: oklch(0.955 0 0);\n  --accent-foreground: oklch(0.205 0 0);\n  --secondary: oklch(0.955 0 0);\n  --secondary-foreground: oklch(0.205 0 0);\n  --border: oklch(0.922 0 0);\n  --input: oklch(0.922 0 0);\n  --ring: oklch(0.715 0 0);\n  --layout: oklch(0.985 0 0);             /* page chrome */\n\n  /* --- Primary (maps to brand-15 on light for contrast) --- */\n  --primary: var(--brand-15);\n  --primary-foreground: oklch(0.269 0 0);\n  --button-primary: var(--brand-10);\n\n  /* --- Semantic --- */\n  --destructive: oklch(0.577 0.245 27.325);\n  --destructive-foreground: oklch(1 0 0);\n  --warning: oklch(0.769 0.165 70.08);\n  --warning-foreground: oklch(0.987 0.026 102.212);\n  --success: oklch(0.635 0.185 147.775);\n  --success-foreground: oklch(0.941 0.023 151.642);\n  --informative: oklch(0.615 0.133 261.34);\n  --informative-foreground: oklch(0.969 0.006 255.475);\n  --link: oklch(0.551 0.124 239.032);\n\n  /* --- Alternates (chart/categorical palette) --- */\n  --alternate-1: oklch(0.776 0.003 264.539);  /* cool gray */\n  --alternate-2: oklch(0.65  0.226 27.094);   /* red */\n  --alternate-3: oklch(0.763 0.165 60.077);   /* orange */\n  --alternate-4: oklch(0.875 0.165 91.772);   /* amber */\n  --alternate-5: oklch(0.741 0.199 147.068);  /* green */\n  --alternate-6: oklch(0.759 0.113 210.52);   /* teal */\n  --alternate-7: oklch(0.682 0.167 246.753);  /* blue */\n  --alternate-8: oklch(0.733 0.158 302.329);  /* purple */\n  --alternate-9: oklch(0.779 0.146 350.729);  /* pink */\n\n  /* --- Charts: ramp of brand --- */\n  --chart-1: var(--brand-15);\n  --chart-2: var(--brand-20);\n  --chart-3: var(--brand-25);\n  --chart-4: var(--brand-30);\n  --chart-5: var(--brand-35);\n  --chart-6: var(--brand-40);\n  --chart-7: var(--brand-45);\n  --chart-8: var(--brand-50);\n  --chart-9: var(--brand-55);\n  --chart-10: var(--brand-60);\n\n  /* --- Sidebar --- */\n  --sidebar: oklch(0.97 0 0);\n  --sidebar-foreground: oklch(0.145 0 0);\n  --sidebar-primary: oklch(0.205 0 0);\n  --sidebar-primary-foreground: oklch(0.985 0 0);\n  --sidebar-accent: oklch(0.922 0 0 / 0.7);\n  --sidebar-accent-foreground: oklch(0.205 0 0);\n  --sidebar-border: oklch(0.922 0 0);\n  --sidebar-muted: oklch(0.715 0 0);\n\n  /* --- Spacing (Tailwind 4 defaults — recorded for reference) --- */\n  --space-1: 0.25rem;\n  --space-2: 0.5rem;\n  --space-3: 0.75rem;\n  --space-4: 1rem;\n  --space-5: 1.25rem;\n  --space-6: 1.5rem;\n  --space-8: 2rem;\n  --space-10: 2.5rem;\n  --space-12: 3rem;\n\n  /* --- Shadows (shadcn 'new-york' style, tuned mild) --- */\n  --shadow-xs: 0 1px 2px 0 oklch(0 0 0 / 0.05);\n  --shadow-sm: 0 1px 2px 0 oklch(0 0 0 / 0.05), 0 1px 3px 0 oklch(0 0 0 / 0.08);\n  --shadow-md: 0 2px 4px -1px oklch(0 0 0 / 0.06), 0 4px 6px -1px oklch(0 0 0 / 0.08);\n  --shadow-lg: 0 4px 6px -2px oklch(0 0 0 / 0.05), 0 10px 15px -3px oklch(0 0 0 / 0.10);\n  --shadow-xl: 0 10px 10px -5px oklch(0 0 0 / 0.04), 0 20px 25px -5px oklch(0 0 0 / 0.10);\n}\n\n.dark {\n  --background: oklch(0.145 0 0);\n  --foreground: oklch(0.985 0 0);\n  --card: oklch(0.205 0 0);\n  --card-foreground: oklch(0.985 0.001 106.424);\n  --popover: oklch(0.269 0 0);\n  --popover-foreground: oklch(0.985 0 0);\n  --muted: oklch(0.269 0 0);\n  --muted-foreground: oklch(0.715 0 0);\n  --accent: oklch(0.371 0 0);\n  --accent-foreground: oklch(0.985 0 0);\n  --secondary: oklch(0.269 0 0);\n  --secondary-foreground: oklch(0.985 0 0);\n  --border: oklch(1 0 0 / 0.10);\n  --input: oklch(1 0 0 / 0.15);\n  --ring: oklch(0.556 0 0);\n  --layout: oklch(0.235 0 0);\n\n  --primary: var(--brand);\n  --primary-foreground: oklch(0.205 0 0);\n  --button-primary: var(--brand);\n}\n\n/* ============================================================\n   Base + semantic text\n   ============================================================ */\n\nhtml, body {\n  background: var(--layout);\n  color: var(--foreground);\n  font-family: var(--font-sans);\n  letter-spacing: var(--tracking-normal);\n  -webkit-font-smoothing: antialiased;\n}\n\n/* Heading utilities (mirror Lattice .heading-* utilities) */\n.heading-xl {\n  font-family: var(--font-sans);\n  font-size: 3rem;       /* 48 */\n  line-height: 3rem;\n  font-weight: 600;\n  letter-spacing: var(--tracking-normal);\n}\n.heading-lg {\n  font-family: var(--font-sans);\n  font-size: 2.25rem;    /* 36 */\n  line-height: 2.5rem;\n  font-weight: 500;\n  letter-spacing: var(--tracking-normal);\n}\n.heading-md {\n  font-family: var(--font-sans);\n  font-size: 1.875rem;   /* 30 */\n  line-height: 2.25rem;\n  font-weight: 500;\n}\n.heading-sm {\n  font-family: var(--font-sans);\n  font-size: 1.5rem;     /* 24 */\n  line-height: 2rem;\n  font-weight: 500;\n}\n\n/* Title levels (via <Title level=\"h1\"...> in Lattice) */\nh1, .title-h1 { font: 500 2.25rem/2.5rem var(--font-sans); letter-spacing: var(--tracking-normal); }\nh2, .title-h2 { font: 500 1.875rem/2.25rem var(--font-sans); }\nh3, .title-h3 { font: 500 1.5rem/2rem var(--font-sans); }\nh4, .title-h4 { font: 500 1.25rem/1.75rem var(--font-sans); }\n\n/* Text levels */\n.text-xSmall  { font: 400 0.75rem/1rem var(--font-sans); }     /* 12 */\n.text-small   { font: 400 0.875rem/1.25rem var(--font-sans); } /* 14 */\n.text-base    { font: 400 1rem/1.5rem var(--font-sans); }      /* 16 */\n.text-large   { font: 400 1.125rem/1.75rem var(--font-sans); } /* 18 */\n\n/* Code / mono */\ncode, .inline-code, .mono {\n  font-family: var(--font-mono);\n  font-size: 0.875em;\n}\npre {\n  font-family: var(--font-mono);\n  background: var(--muted);\n  padding: 0.75rem 1rem;\n  border-radius: var(--radius-md);\n  overflow-x: auto;\n}\n\n/* Link */\na, .link { color: var(--link); text-underline-offset: 4px; }\na:hover { text-decoration: underline; }\n<\u002Fstyle>\n<style>/* PP Neue Montreal — Kognitos Lattice brand typeface.\n   Note: We only ship Regular / Medium / SemiBold / Italic woff2 files in this\n   project. The full family (incl. SemiBolditalic) lives in the source repo. */\n\n@font-face {\n  font-fami 40,0.5);\n    --yellow-ink:#5F6B00;\n    --row-open-bg:#FBFFE0;\n    --good:#16A34A; --warn:#C2620C; --bad:#DC2626;\n    --field:#F7F7F5;\n    --st-neutral-fg:#525252; --st-neutral-bg:#F5F5F5; --st-neutral-bd:#E5E5E5;\n    --st-indigo-fg:#3730A3;  --st-indigo-bg:#EEF2FF;  --st-indigo-bd:#C7D2FE;\n    --st-orange-fg:#9A3412;  --st-orange-bg:#FFF7ED;  --st-orange-bd:#FED7AA;\n    --st-blue-fg:#1E40AF;    --st-blue-bg:#EFF6FF;    --st-blue-bd:#BFDBFE;\n    --st-amber-fg:#854D0E;   --st-amber-bg:#FEF3C7;   --st-amber-bd:#FDE68A;\n    --st-emerald-fg:#065F46; --st-emerald-bg:#ECFDF5; --st-emerald-bd:#A7F3D0;\n    --st-fuchsia-fg:#5B21B6; --st-fuchsia-bg:#F5F3FF; --st-fuchsia-bd:#DDD6FE;\n    --st-red-fg:#991B1B;     --st-red-bg:#FEF2F2;     --st-red-bd:#FECACA;\n    --shadow:0 24px 64px rgba(0,0,0,0.16);\n  }\n  html,body{margin:0;padding:0;background:var(--bg);}\n  body{font-family:var(--sans);color:var(--fg);letter-spacing:0.01em;-webkit-font-smoothing:antialiased;}\n  *{box-sizing:border-box;}\n  a{color:var(--fg);text-decoration:underline;text-underline-offset:2px;}\n  a:hover{color:var(--yellow-ink);}\n  input,select,textarea,button{font-family:inherit;letter-spacing:inherit;}\n  ::-webkit-scrollbar{width:10px;height:10px}\n  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid transparent;background-clip:content-box}\n  @keyframes flashSaved{0%{background:var(--yellow-soft)}100%{background:transparent}}\n  @keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n  @keyframes rowIn{from{opacity:0}to{opacity:1}}\n  @keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n  @keyframes riseInCentred{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}\n  @keyframes panelIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}\n  @keyframes savedPulse{0%{box-shadow:0 0 0 0 var(--yellow-line)}100%{box-shadow:0 0 0 7px transparent}}\n  @keyframes laneGlow{0%,100%{border-color:var(--yellow-line)}50%{border-color:var(--yellow)}}\n  @keyframes sheen{from{background-position:-140% 0}to{background-position:240% 0}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100vh;background:var(--bg);color:var(--fg)\">\n\n  <!-- ── mockup chrome ─────────────────────────────────────────────── -->\n  <div style=\"position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:20px;padding:0 20px;height:52px;background:var(--s2);border-bottom:1px solid var(--line)\">\n    <div style=\"display:flex;align-items:baseline;gap:10px;flex-shrink:0\">\n      <span style=\"font-size:13px;font-weight:600\">V2 Migration + Delivery<\u002Fspan>\n      <span style=\"font-size:11px;color:var(--fgm)\">redesign · 2026-09-03<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:2px;margin-left:8px\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"border:1px solid {{ t.bd }};background:{{ t.bg }};color:{{ t.fg }};padding:6px 12px;font-size:12px;border-radius:6px;cursor:pointer;white-space:nowrap\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto;display:flex;align-items:center;gap:10px\">\n      <span style=\"font-size:11px;color:var(--fgm)\">{{ themeLabel }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ toggleTheme }}\" style=\"width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);background:transparent;color:var(--fgm);border-radius:6px;cursor:pointer\">\n        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41\"><\u002Fpath><\u002Fsvg>\n      <\u002Fb lex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0\">\n                <sc-for list=\"{{ viewToggle }}\" as=\"v\" hint-placeholder-count=\"2\">\n                  <button sc-camel-on-click=\"{{ v.onClick }}\" style=\"border:0;background:{{ v.bg }};color:{{ v.fg }};padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer\">{{ v.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ openNew }}\" style=\"border:1px solid var(--fg);background:var(--yellow);color:#171717;font-weight:600;font-size:12px;padding:7px 14px;border-radius:99px;cursor:pointer\">New process<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- section switcher: V2 Migration now lives inside Delivery -->\n          <div style=\"padding:20px 28px 0;display:flex;align-items:flex-end;gap:26px;border-bottom:1px solid var(--line);margin:20px 28px 0;padding:0\">\n            <sc-for list=\"{{ sections }}\" as=\"s\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"display:flex;align-items:baseline;gap:8px;border:0;border-bottom:2px solid {{ s.bd }};background:transparent;color:{{ s.fg }};font-size:14px;font-weight:{{ s.weight }};padding:0 2px 10px;margin-bottom:-1px;cursor:pointer\">\n                {{ s.label }}\n                <span style=\"font-family:var(--mono);font-size:11px;color:var(--fgm)\">{{ s.count }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n            <span style=\"margin-bottom:10px;font-size:11px;color:var(--fgm)\">{{ sectionNote }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <!-- customer rollup strip (V2 only) -->\n          <sc-if value=\"{{ showRollup }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:22px 28px 0\">\n              <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:10px\">\n                <span style=\"font-           <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"border-top:1px solid var(--line);padding:12px 16px\">\n                  <sc-if value=\"{{ isColorTab }}\" hint-placeholder-val=\"\">\n                    <div>\n                      <div style=\"display:flex;gap:6px;margin-bottom:10px\">\n                        <sc-for list=\"{{ colorFieldTabs }}\" as=\"f\" hint-placeholder-count=\"3\">\n                          <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"border:1px solid {{ f.bd }};background:{{ f.bg }};color:{{ f.fg }};font-size:12px;padding:5px 10px;border-radius:7px;cursor:pointer\">{{ f.label }}<\u002Fbutton>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;flex-direction:column;gap:6px;max-height:250px;overflow-y:auto\">\n                        <sc-for list=\"{{ colorRows }}\" as=\"c\" hint-placeholder-count=\"5\">\n                          <div style=\"display:flex;align-items:center;gap:10px\">\n                            <span style=\"min-width:132px;font-size:11px;padding:3px 8px;border-radius:6px;background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.bd }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background 200ms ease,color 200ms ease,border-color 200ms ease\">{{ c.label }}<\u002Fspan>\n                            <div style=\"display:flex;gap:5px\">\n                              <sc-for list=\"{{ c.swatches }}\" as=\"s\" hint-placeholder-count=\"8\">\n                                <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"width:17px;height:17px;border-radius:5px;background:{{ s.color }};border:2px solid {{ s.ring }};cursor:pointer;padding:0;transition:transform 120ms ease\" style-hover=\"transform:scale(1.18)\"><\u002Fbutton>\n                              <\u002Fsc-for>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;align-items:center;gap:10px;margin-top:12px\">\n                        <span style=\"font-size:11px;color:var(--fgm);line-height:1.5\">Colours are per value, not per row. They follow the value everywhere — table, board, rollup.<\u002Fspan>\n                        <button sc-camel-on-click=\"{{ resetColors }}\" style=\"margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--fgm);font-size:11.5px;padding:5px 10px;border-radius:7px;cursor:pointer;white-space:nowrap\">Reset<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ isValueTab }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto\">\n                    <sc-for list=\"{{ configItems }}\" as=\"i\" hint-placeholder-count=\"6\">\n                      <div style=\"display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;background:var(--field);font-size:12.5px\">\n                        <span>{{ i.label }}<\u002Fspan>\n                        <span style=\"margin-left:auto;font-family:var(--mono);font-size:10.5px;color:{{ i.fg }}\">{{ i.meta }}<\u002Fspan>\n                        <span style=\"font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--yellow-ink)\">{{ i.tag }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:8px;margin-top:10px\">\n                    <input value=\"{{ newValue }}\" sc-camel-on-input=\"{{ onNewValue }}\" placeholder=\"{{ configPlaceholder }}\" style=\"flex:1;background:transparent;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--fg);outline:none\">\n                    <button sc-camel-on-click=\"{{ onAddValue }}\" style=\"border:1px solid var(--fg);background:var(--yellow);color:#171717;font-weight:600;font-size:12px;padding:6px 14px;border-radius:7px;cursor:pointer\">Add<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:9px;font-size:11px;color:var(--fgm);line-height:1.5\">{{ configHint }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"display:flex;padding:11px 16px;border-top:1px solid var(--line);background:var(--s2)\">\n                  <button sc-camel-on-click=\"{{ closeConfig }}\" style=\"margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--fgb);font-size:12px;padding:6px 14px;border-radius:7px;cursor:pointer\">Done<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- bulk action dialog -->\n          <sc-if value=\"{{ bulkDialog }}\" hint-placeholder-val=\"\">\n            <div sc-camel-on-click=\"{{ closeBulkDialog }}\" style=\"position:fixed;inset:0;z-index:95;background:rgba(0,0,0,0.5);display:grid;place-items:center;padding:32px\">\n              <div sc-camel-on-click=\"{{ stop }}\" style=\"width:min(420px,100%);background:var(--s1);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);animation:riseIn 160ms ease-out;overflow:hidden\">\n                <div style=\"padding:14px 16px;border-bottom:1px solid var(--line);background:var(--s2)\">\n                  <div style=\"font-size:14px;font-weight:600\">{{ bulkDialog.title }}<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:var(--fgm);margin-top:3px\">{{ bulkDialog.subtitle }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:14px 16px\">\n                  <sc-if value=\"{{ bulkDialog.isRoster }}\" hint-placeholder-val=\"{{ true }}\">\n                    <dc-import name=\"Roster picker\" field-label=\"New FDE owner\" kind=\"person\" on-pick=\"{{ bulkDialog.onPick }}\" hint-size=\"100%,300px\"><\u002Fdc-import>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ bulkDialog.isList }}\" hint-placeholder-val=\"\">\n                    <div style=\"display:flex;flex-direction:column;gap:4px;max-height:280px;overflow-y:auto\">\n                      <sc-for list=\"{{ bulkDialog.options }}\" as=\"o\" hint-placeholder-count=\"5\">\n                        <div sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid {{ o.bd }};border-radius:8px;font-size:12.5px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}\">\n                          <span style=\"width:12px;color:var(--yellow-ink)\">{{ o.mark }}<\u002Fspan>{{ o.label }}\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ bulkDialog.isNote }}\" hint-placeholder-val=\"\">\n                    <textarea value=\"{{ bulkNote }}\" sc-camel-on-input=\"{{ onBulkNote }}\" rows=\"3\" placeholder=\"This note is appended to every selected process.\" style=\"width:100%;resize:vertical;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:12.5px;line-height:1.5;color:var(--fg);outline:none\"><\u002Ftextarea>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px;padding:11px 16px;border-top:1px solid var(--line);background:var(--s2)\">\n                  <span style=\"font-size:11px;color:var(--fgm)\">{{ bulkDialog.footer }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ closeBulkDialog }}\" style=\"margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--fgm);font-size:12px;padding:6px 12px;border-radius:7px;cursor:pointer\">Cancel<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ bulkDialog.onApply }}\" style=\"border:1px solid var(--fg);background:var(--yellow);color:#171717;font-weight:600;font-size:12px;padding:6px 14px;border-radius:7px;cursor:pointer\">{{ bulkDialog.cta }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- overlay detail -->\n          <sc-if value=\"{{ showOverlayDetail }}\" hint-placeholder-val=\"\">\n            <div style=\"position:fixed;inset:0;z-index:90;background:rgba(0,0,0,0.5);display:grid;place-items:start center;padding:64px 24px;overflow:auto\">\n              <div style=\"width:min(880px,100%);animation:riseIn 180ms ease-out\">\n                <dc-import name=\"Process detail\" detail=\"{{ detail }}\" hint-size=\"100%,600px\"><\u002Fdc-import>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══ PANEL: process detail standalone ══ -->\n      <sc-if value=\"{{ isDetailPanel }}\" hint-placeholder-val=\"\">\n        <div style=\"padding:28px 28px 80px;max-width:1180px\">\n          <div style=\"font-size:10px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:var(--fgm)\">Component<\u002Fdiv>\n          <h1 style=\"font-size:30px;font-weight:600;letter-spacing:-0.03em;margin:8px 0 0\">The process detail surface<\u002Fh1>\n          <p style=\"margin:8px 0 0;font-size:13px;color:var(--fgm);max-width:70ch;line-height:1.6\">One surface, two mounts. The drawer is gone: no scrim by default, no slide-in from the edge, no 132px label column. Fields sit in a two-up grid with the value as the primary type and the label as quiet metadata — so a record reads as a record, not as a form. Per-field auto-save is kept; each field flashes and stamps who saved it.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:22px 0 26px\">\n            <sc-for list=\"{{ patternNotes }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:14px\">\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <span style=\"font-family:var(--mono);font-size:10px;color:var(--yellow-ink)\">{{ p.tag }}<\u002Fspan>\n                  <span style=\"font-size:12.5px;font-weight:500\">{{ p.title }}<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin:7px 0 0;font-size:12px;color:var(--fgm);line-height:1.55\">{{ p.body }}<\u002Fp>\n                <button sc-camel-on-click=\"{{ p.onClick }}\" style=\"margin-top:11px;border:1px solid var(--line);background:var(--field);color:var(--fgb);font-size:11.5px;padding:5px 10px;border-radius:6px;cursor:pointer\">{{ p.cta }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"max-width:820px\">\n            <dc-import name=\"Process detail\" detail=\"{{ detail }}\" hint-size=\"100%,600px\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══ PANEL: activity feed ══ -->\n      <sc-if value=\"{{ isNotesPanel }}\" hint-placeholder-val=\"\">\n        <div style=\"padding:28px 28px 80px;max-width:1180px\">\n          <div style=\"font-size:10px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:var(--fgm)\">Component<\u002Fdiv>\n          <h1 style=\"font-size:30px;font-weight:600;letter-spacing:-0.03em;margin:8px 0 0\">Activity feed<\u002Fh1>\n          <p style=\"margin:8px 0 0;font-size:13px;color:var(--fgm);max-width:70ch;line-height:1.6\">Replaces the two overwritable text fields. Append-only, attributed, timestamped. A note and a blocker are the same object with a different kind — posting a blocker also flips the record's blocked state, which is why the composer's kind switch sits next to the send button rather than hidden in a menu. Field-change history is real but noisy, so it lives collapsed underneath instead of interleaved.<\u002Fp>\n          <div style=\"max-width:660px;margin-top:24px\">\n            <dc-import name=\"Activity feed\" notes=\"{{ notes }}\" hint-size=\"100%,520px\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══ PANEL: roster picker ══ -->\n      <sc-if value=\"{{ isRosterPanel }}\" hint-placeholder-val=\"\">\n        <div style=\"padding:28px 28px 80px;max-width:1180px\">\n          <div style=\"font-size:10px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:var(--fgm)\">Component<\u002Fdiv>\n          <h1 style=\"font-size:30px;font-weight:600;letter-spacing:-0.03em;margin:8px 0 0\">Roster picker<\u002Fh1>\n          <p style=\"margin:8px 0 0;font-size:13px;color:var(--fgm);max-width:70ch;line-height:1.6\">One control for FDE, TAM and Partner. It types ahead against roster_entries, matches known aliases silently (\"Karthik N\" finds Karthik Nagabhushana and shows why it matched), and the only way to add a stray value is the explicit \"add to roster\" path — which creates a real entry rather than a new free-text spelling.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;max-width:900px;margin-top:24px;align-items:start\">\n            <dc-import name=\"Roster picker\" field-label=\"FDE owner\" kind=\"person\" hint-size=\"100%,320px\"><\u002Fdc-import>\n            <dc-import name=\"Roster picker\" field-label=\"Partner\" kind=\"partner_org\" hint-size=\"100%,320px\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:940}}\">\nconst STAGE = {\n  not_required: { l: \"Not required\", c: \"neutral\" },\n  in_development: { l: \"In development\", c: \"indigo\" },\n  engg_pending: { l: \"Engg pending\", c: \"orange\" },\n  parity_testing: { l: \"Parity testing\", c: \"blue\" },\n  customer_validation: { l: \"Customer validation\", c: \"amber\" },\n  live_on_v2: { l: \"Live on v2\", c: \"emerald\" },\n  v2_native: { l: \"V2 native\", c: \"emerald\" },\n  migrated_pending_commercial: { l: \"Migrated · pending commercial\", c: \"fuchsia\" },\n};\n// Table chips use a short form; the detail surface keeps the full\n// MIGRATION_STAGE_LABELS string from lib/supabase/types.ts.\nconst SHORT = { migrated_pending_commercial: \"Pending commercial\", customer_validation: \"Validation\" };\nconst DONE = [\"live_on_v2\", \"v2_native\", \"migrated_pending_commercial\"];\nconst V2_LANES = [\"in_development\", \"engg_pending\", \"parity_testing\", \"customer_validation\", \"live_on_v2\", \"migrated_pending_commercial\", \"v2_native\"];\nconst DELIVERY_LANES = [\n  { k: \"pipeline\", l: \"Pipeline\", dot: \"var(--st-neutral-fg)\" },\n  { k: \"building\", l: \"Building\", dot: \"var(--st-indigo-fg)\" },\n  { k: \"validating\", l: \"Validating\", dot: \"var(--st-amber-fg)\" },\n  { k: \"stuck\", l: \"Stuck\", dot: \"var(--bad)\" },\n];\nconst LANE_REQUIRES = {\n  stuck: { field: \"blocked_on\", text: \"Moving to Stuck needs a reason. Everything else is already saved.\", options: [\n    { v: \"customer\", l: \"Blocked on customer\" }, { v: \"kognitos_engg\", l: \"Blocked on Kognitos engg\" },\n    { v: \"kognitos_delivery\", l: \"Blocked on Kognitos delivery\" }, { v: \"partner\", l: \"Blocked on partner\" }] },\n  validating: { field: \"uat_owner\", text: \"Validating needs a UAT owner on the customer side.\", options: [\n    { v: \"matt\", l: \"Matt Reagan\" }, { v: \"dana\", l: \"Dana Whitcomb\" }, { v: \"tbd\", l: \"Not identified yet\" }] },\n};\n// Stage/lifecycle vocabularies are configurable at runtime (see the Configure\n// dialog) — resolve through these rather than the frozen literals.\nconst stageDefFrom = (custom) => (k) => STAGE[k] || custom.find((c) => c.k === k) || { l: k, c: \"neutral\" };\nconst HEALTH = { on_track: \"var(--good)\", at_risk: \"var(--warn)\", off_track: \"var(--bad)\" };\nconst HEALTH_HUE = { on_track: \"emerald\", at_risk: \"amber\", off_track: \"red\" };\nconst HEALTHS = [\"on_track\", \"at_risk\", \"off_track\"];\n\nfunction initials(n) {\n  if (!n) return \"—\";\n  const p = n.split(\" \").filter(Boolean);\n  return ((p[0] || \"\")[0] + (p[1] || \"\")[0] || p[0][0]).toUpperCase();\n}\nfunction money(n) {\n  if (n == null) return \"—\";\n  if (n >= 1e6) return \"$\" + (n / 1e6).toFixed(1) + \"M\";\n  if (n >= 1e3) return \"$\" + Math.round(n / 1e3) + \"K\";\n  return \"$\" + n;\n}\n\n// Lifecycle is derived from migration stage + lane so the three taxonomies\n// can never contradict each other (mirrors viewForLifecycle in the repo).\nconst LC_FOR_STAGE = {\n  live_on_v2: \"live\", v2_native: \"live\", migrated_pending_commercial: \"live\", not_required: \"live\",\n  customer_validation: \"uat\", parity_testing: \"uat\",\n  in_development: \"in_development\", engg_pending: \"in_development\",\n};\nconst STAGE_ORDER = [\"in_development\", \"engg_pending\", \"parity_testing\", \"customer_validation\", \"live_on_v2\", \"migrated_pending_commercial\", \"v2_native\"];\nconst addDays = (iso, n) => { const d = new Date(iso); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };\nconst P = (o) => {\n  const kickoff = o.kickoff || \"2026-02-17\";\n  const idx = STAGE_ORDER.indexOf(o.stage);\n  return Object.assign({\n    health: \"on_track\", blockers: null, tickets: [], arr: null, pct: 0, stale: 4,\n    partner: null, tam: \"Paige Urig\", platform: \"v1\", lane: \"building\",\n    phase: \"m2_development\", kickoff, golive: null, effort: 120, companySize: null,\n    // Gate dates exist only once the process has actually passed that gate.\n    dateParity: idx >= 2 ? addDays(kickoff, 70) :
